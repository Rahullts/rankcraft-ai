services:
  - type: web
    name: ai-seo-content-assistant
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_MODEL
        value: mock-model
